<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>預約成功</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="index.html">預約拍照</a>
  </div>
</nav>

<main class="container">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm text-center">
        <div class="card-body py-5">
          <div class="display-4 mb-3">✅</div>
          <h3 class="mb-3">預約已送出！</h3>
          <p class="text-muted mb-4">我們將會與您聯繫確認。</p>

          <table class="table table-bordered text-start mb-4" id="summaryTable">
            <tbody></tbody>
          </table>

          <a href="index.html" class="btn btn-outline-primary">回首頁</a>
          <a href="booking.html" class="btn btn-primary ms-2">再次預約</a>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  var raw = sessionStorage.getItem("bookingResult");
  if (raw) {
    var r    = JSON.parse(raw);
    var rows = [
      ["姓名", r.name],
      ["日期", r.date],
      ["時間", r.time],
      ["主要方案", r.base],
      ["加購服務", (r.addOns && r.addOns.length) ? r.addOns.join("、") : "（無）"],
      ["預約編號", r.id]
    ];
    var tbody = document.querySelector("#summaryTable tbody");
    rows.forEach(function(row) {
      var tr = document.createElement("tr");
      tr.innerHTML = "<th class='w-25 bg-light'>" + row[0] + "</th><td>" + row[1] + "</td>";
      tbody.appendChild(tr);
    });
    sessionStorage.removeItem("bookingResult");
  }
</script>
</body>
</html>
